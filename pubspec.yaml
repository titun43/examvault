name: examvault
description: ExamVault - India's #1 MCQ Mock Test platform for Railway, SSC, UPSC, Banking, ADRE & State Exams.
publish_to: 'none'
version: 1.44.6+60

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ==================== FIREBASE ====================
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  firebase_messaging: ^14.7.19
  firebase_analytics: ^10.8.9
  firebase_crashlytics: ^3.4.18
  firebase_remote_config: ^4.3.17

  # ==================== STATE MANAGEMENT ====================
  provider: ^6.1.2
  flutter_riverpod: ^2.4.9

  # ==================== AUTH ====================
  google_sign_in: ^6.2.1
  pinput: ^4.0.0

  # ==================== PAYMENT ====================
  razorpay_flutter: ^1.3.5

  # ==================== ADS ====================
  google_mobile_ads: ^4.0.0

  # ==================== UI / WIDGETS ====================
  cupertino_icons: ^1.0.6
  animate_do: ^3.3.4
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  auto_size_text: ^3.0.0
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.1.0
  flutter_carousel_widget: ^2.2.0
  fl_chart: ^0.66.2
  percent_indicator: ^4.2.3
  like_button: ^2.0.5

  # ==================== NAVIGATION ====================
  go_router: ^13.2.0

  # ==================== STORAGE / CACHE ====================
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_cache_manager: ^3.3.1
  path_provider: ^2.1.2

  # ==================== NETWORK ====================
  dio: ^5.4.1
  connectivity_plus: ^5.0.2
  http: ^1.2.0

  # ==================== UTILITIES ====================
  intl: ^0.19.0
  uuid: ^4.3.3
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  collection: ^1.18.0
  timeago: ^3.6.1
  timezone: ^0.9.4
  flutter_local_notifications: 17.2.4
  url_launcher: ^6.2.5
  share_plus: ^7.2.2
  package_info_plus: ^5.0.1
  device_info_plus: ^9.0.2
  permission_handler: ^11.2.0
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  logger: ^2.0.2+1
  toastification: ^1.2.0
  flutter_html: ^3.0.0-beta.2
  webview_flutter: ^4.7.0

  # ==================== PDF ====================
  # pdf and printing removed (not used in code, caused AndroidX lStar conflict)

  # ==================== CALENDAR / DATE ====================
  table_calendar: ^3.0.9

  # ==================== ICONS ====================
  font_awesome_flutter: 10.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

# ==================== APP ICON CONFIG ====================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

# ==================== SPLASH SCREEN CONFIG ====================
flutter_native_splash:
  color: "#1565C0"
  image: assets/images/splash.png
  android_12:
    image: assets/images/splash.png
    color: "#1565C0"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
