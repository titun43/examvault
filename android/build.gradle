// =============================================================================
// ExamVault - Android build.gradle (project level)
// =============================================================================
// All plugins are declared in settings.gradle (new Flutter style).
// This file contains only the allprojects block and clean task.
//
// NOTE: Do NOT put app-level config (compileSdk, targetSdk, applicationId,
// signingConfigs, buildTypes, etc.) here. Those belong in app/build.gradle.
// Putting them here causes Gradle to try to apply them to the root project,
// which fails with "settings.gradle.kts does not exist" when R8/minification
// is enabled.
// =============================================================================

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
