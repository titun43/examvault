// =============================================================================
// EXAMVAULT - Android build.gradle (app level)
// =============================================================================
// Package: com.examvault.education
//
// CHANGES (v1.52.1+80):
//   - targetSdk 34 → 35   (Google Play policy: must target API 35+)
//   - compileSdk 34 → 35
//   - ndkVersion updated to r27+ (16KB page size native support)
//   - Added packagingOptions for jniLibs 16KB alignment
// =============================================================================

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutterVersionName') ?: '1.0.0'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.examvault.education"
    compileSdk 35
    ndkVersion "27.0.12077973"    // ← NDK r27+ (16KB page size support সহ)

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.examvault.education"
        minSdk 21
        targetSdk 35               // ← Google Play policy: 35+ mandatory
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    // =========================================================================
    // 16KB Memory Page Size Support (Android 15+ requirement)
    // NDK r27+ natively supports 16KB page size. useLegacyPackaging = true
    // ensures the .so files are extracted at install time (avoids alignment
    // issues on devices with 16KB page size).
    // =========================================================================
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // =====================================================================
            // ADMOB APP ID — MUST STAY IN SYNC WITH app_config.dart!
            // =====================================================================
            manifestPlaceholders = [
                admobAppId: "ca-app-pub-3940256099942544~3347511713"
            ]
        }
        debug {
            manifestPlaceholders = [
                admobAppId: "ca-app-pub-3940256099942544~3347511713"
            ]
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'

    // Core library desugaring (required by flutter_local_notifications 17.x)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Firebase BoM - manages all Firebase versions
    implementation platform('com.google.firebase:firebase-bom:32.7.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // Razorpay
    implementation 'com.razorpay:checkout:1.6.33'

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
