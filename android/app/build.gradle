// =============================================================================
// EXAMVAULT - Android build.gradle (app level)
// =============================================================================
// Package: com.examvault.education
// AdMob App ID, Firebase, Razorpay - all configured.
// Just make sure google-services.json is present.
// =============================================================================

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.examvault.education"
    compileSdk 35
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.examvault.education"
        minSdk 21
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // =====================================================================
            // ADMOB APP ID — MUST STAY IN SYNC WITH app_config.dart!
            // =====================================================================
            // The AdMob SDK reads this App ID from the AndroidManifest at NATIVE
            // init time (MobileAds.instance.initialize()). This happens BELOW
            // Dart's runZonedGuarded / try-catch, so if the SDK crashes here it
            // will kill the whole app process and CANNOT be caught in Dart.
            //
            // RULE: this value must match AppConfig.admobTestMode in
            // lib/config/app_config.dart:
            //   • admobTestMode == true  → use TEST app ID  (ca-app-pub-3940256099942544~3347511713)
            //   • admobTestMode == false → use REAL app ID  (ca-app-pub-1742730064755213~7890219994)
            //
            // WHY: the real AdMob account (pub-1742730064755213) is still
            // pending Google review. Initializing the native SDK with the real
            // App ID while the account is unapproved causes a NATIVE CRASH on
            // real devices (release builds) that bypasses every Dart error
            // handler. It also leaves AdMobService._initialized = false, so
            // loadInterstitialAd() short-circuits and NO ad ever loads — which
            // is exactly the "app crashing + ads not running" symptom.
            //
            // Since admobTestMode is currently true, the release manifest MUST
            // also use the TEST App ID. Flip both back to real when the AdMob
            // account is approved and serving.
            // =====================================================================
            manifestPlaceholders = [
                admobAppId: "ca-app-pub-3940256099942544~3347511713"
            ]
        }
        debug {
            // Test AdMob App ID (debug always tests with the sample App ID)
            manifestPlaceholders = [
                admobAppId: "ca-app-pub-3940256099942544~3347511713"
            ]
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'

    // Core library desugaring (required by flutter_local_notifications 17.x)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Firebase BoM - manages all Firebase versions
    implementation platform('com.google.firebase:firebase-bom:32.7.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // Razorpay
    implementation 'com.razorpay:checkout:1.6.33'

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
