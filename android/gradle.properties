org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.suppressUnsupportedCompileSdk=35

# R8 full mode = false — uses compat mode where missing classes produce
# warnings instead of build failures. This still generates mapping.txt
# (the deobfuscation file Play Console wants) but doesn't break the build
# on transitive classes that R8 full mode can't find (e.g. smart_auth
# references to com.google.android.gms.auth.api.credentials.* which are
# only present at runtime via play-services-auth).
android.enableR8.fullMode=false
