# =============================================================================
# ExamVault - ONE-TIME: Extract Upload Key Public Certificate (.pem)
# =============================================================================
# This workflow decodes the stable release keystore (from GitHub Secret
# KEYSTORE_BASE64) and extracts its PUBLIC certificate as a .pem file.
#
# WHY: Play Console's "Request upload key reset" requires the .pem public
# certificate of the NEW upload key. Once Google approves the reset, the
# Play Console will accept AABs signed by this keystore.
#
# HOW TO USE:
#   1. GitHub → Actions tab → "Extract Upload Key (.pem)" → Run workflow
#   2. Wait for it to finish (~30 seconds)
#   3. Download the "upload-key-pem" artifact
#   4. Unzip it → you get `upload_key.pem`
#   5. Play Console → Setup → App integrity → Request upload key reset
#      → upload `upload_key.pem`
#   6. After Google approves, re-upload your AAB to Closed Testing
#
# After the reset is approved, you can delete this workflow file.
# =============================================================================

name: Extract Upload Key (.pem)

on:
  workflow_dispatch:

jobs:
  extract:
    name: Extract .pem from stable keystore
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Java 17 (provides keytool)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Keystore + Extract .pem
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is MISSING."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEYSTORE_PASSWORD / KEY_ALIAS secrets are required."
            exit 1
          fi

          # Write keystore to home dir (no need for repo checkout)
          KS_FILE="$HOME/release.keystore"
          CLEAN_B64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n')
          echo "Decoding keystore..."
          echo "$CLEAN_B64" | base64 -d > "$KS_FILE"
          KS_SIZE=$(wc -c < "$KS_FILE")
          echo "Keystore decoded. Size: $KS_SIZE bytes"

          if [ "$KS_SIZE" -lt 100 ]; then
            echo "::error::Decoded keystore is too small ($KS_SIZE bytes). KEYSTORE_BASE64 secret may be invalid."
            exit 1
          fi

          echo ""
          echo "=== Keystore info ==="
          keytool -list -v -keystore "$KS_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" 2>&1 \
            | grep -iE 'SHA1:|SHA-256:|Owner:|Valid from|Entry type'

          echo ""
          echo "=== Extracting public certificate as .pem ==="
          mkdir -p output
          keytool -exportcert \
            -keystore "$KS_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -rfc \
            -file output/upload_key.pem

          echo "✅ upload_key.pem created."
          echo ""
          echo "=== .pem file contents (first 5 lines) ==="
          head -5 output/upload_key.pem
          echo "..."
          echo ""
          echo "=== Certificate details (verify SHA-1 matches BA:56:A6:05:...) ==="
          keytool -printcert -file output/upload_key.pem 2>/dev/null \
            | grep -iE 'SHA1:|SHA-256:|Owner:'

      - name: Upload .pem as artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-key-pem
          path: output/upload_key.pem
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          rm -f "$HOME/release.keystore"
          echo "Keystore cleaned up."
