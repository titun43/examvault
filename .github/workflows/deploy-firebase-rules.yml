# =============================================================================
# ExamVault - Deploy Firebase Security Rules (Firestore + Storage)
# =============================================================================
# Runs automatically whenever firestore.rules or storage.rules is changed on
# main/master. Can also be triggered manually via workflow_dispatch.
#
# Deploys BOTH:
#   - Firestore security rules + indexes
#   - Storage security rules
#
# Authentication (pick ONE — both work, Service Account is recommended):
#
#   OPTION A (recommended, NO terminal needed) — Service Account JSON:
#     1. Firebase Console → ⚙ Project Settings → Service Accounts tab
#     2. Click "Generate new private key" → confirm → downloads a .json file
#     3. Open the .json file in a text editor, copy ALL of its contents
#     4. GitHub repo → Settings → Secrets → Actions → New secret
#        Name:  FIREBASE_SERVICE_ACCOUNT
#        Value: <paste the entire JSON contents>
#
#   OPTION B (needs terminal) — Firebase CI token:
#     1. Run `firebase login:ci` locally, copy the printed token
#     2. GitHub repo → Settings → Secrets → Actions → New secret
#        Name:  FIREBASE_TOKEN
#        Value: <paste token>
#
# If NEITHER secret is set, the workflow fails fast with a clear error.
# Fallback: deploy rules manually via Firebase Console:
#   - Firestore: Console → Firestore Database → Rules → paste firestore.rules → Publish
#   - Storage:   Console → Storage → Rules → paste storage.rules → Publish
# =============================================================================

name: Deploy Firebase Rules

on:
  push:
    branches: [main, master]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Rules to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate & Deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Authenticating with Service Account JSON..."
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-service-account.json"
            AUTH_FLAG=""
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Authenticating with Firebase CI token..."
            AUTH_FLAG="--token \"$FIREBASE_TOKEN\""
          else
            echo "::error::Neither FIREBASE_SERVICE_ACCOUNT nor FIREBASE_TOKEN secret is set."
            echo "::error::Option A (recommended, no terminal): Firebase Console → ⚙ Project Settings → Service Accounts → Generate new private key → copy JSON → GitHub secret FIREBASE_SERVICE_ACCOUNT"
            echo "::error::Option B (terminal): run 'firebase login:ci' → copy token → GitHub secret FIREBASE_TOKEN"
            echo "::error::Until then, deploy rules manually via Firebase Console:"
            echo "::error::  Firestore: Console → Firestore Database → Rules → paste firestore.rules → Publish"
            echo "::error::  Storage:   Console → Storage → Rules → paste storage.rules → Publish"
            exit 1
          fi

          echo "Deploying Firestore + Storage rules to project: examvaultnew"
          eval firebase deploy --only firestore:rules,firestore:indexes,storage \
            --project examvaultnew \
            $AUTH_FLAG \
            --non-interactive
          echo "✅ Firebase rules deployed successfully."

          # Clean up credentials file
          if [ -f "$HOME/firebase-service-account.json" ]; then
            rm -f "$HOME/firebase-service-account.json"
          fi
