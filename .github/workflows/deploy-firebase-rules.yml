# =============================================================================
# ExamVault - Deploy Firebase Security Rules (Firestore + Storage)
# =============================================================================
# Runs automatically whenever firestore.rules or storage.rules is changed on
# main/master. Can also be triggered manually via workflow_dispatch.
#
# Deploys BOTH:
#   - Firestore security rules + indexes
#   - Storage security rules
#
# Required GitHub Secret:
#   FIREBASE_TOKEN   — generate with: firebase login:ci
#                      then add to GitHub → Settings → Secrets → Actions
#
# Until the token is added, this workflow will fail fast with a clear error.
# You can still deploy rules manually via Firebase Console (recommended):
#   - Firestore: Console → Firestore Database → Rules → paste firestore.rules → Publish
#   - Storage:   Console → Storage → Rules → paste storage.rules → Publish
# =============================================================================

name: Deploy Firebase Rules

on:
  push:
    branches: [main, master]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Rules to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Rules
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is missing."
            echo "::error::Generate it by running: firebase login:ci"
            echo "::error::Then add it in GitHub → Settings → Secrets and variables → Actions"
            echo "::error::Until then, deploy rules manually via Firebase Console:"
            echo "::error::  Firestore: Console → Firestore Database → Rules → paste firestore.rules → Publish"
            echo "::error::  Storage:   Console → Storage → Rules → paste storage.rules → Publish"
            exit 1
          fi
          echo "Deploying Firestore + Storage rules to project: examvaultnew"
          firebase deploy --only firestore:rules,firestore:indexes,storage \
            --project examvaultnew \
            --token "$FIREBASE_TOKEN" \
            --non-interactive
          echo "✅ Firebase rules deployed successfully."
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
