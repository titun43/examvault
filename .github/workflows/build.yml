# =============================================================================
# ExamVault - Build Release APK on GitHub Actions
# =============================================================================
# This workflow builds a signed release APK automatically.
# If KEYSTORE_BASE64 secret is NOT set, it creates a temporary self-signed
# keystore (for testing). For Play Store upload, add the real keystore secret.
# =============================================================================

name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Download deps
        run: flutter pub get

      - name: Decode Keystore (or create temp one)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret found. Creating temporary self-signed keystore for testing..."
            keytool -genkey -v -keystore android/app/examvault-release.keystore \
              -alias examvault -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ExamVault2026! -keypass ExamVault2026! \
              -dname "CN=ExamVault, OU=Dev, O=ExamVault, L=Kolkata, ST=WB, C=IN"
            echo "Temporary keystore created."
          else
            echo "Decoding keystore from secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/examvault-release.keystore
          fi
          ls -la android/app/examvault-release.keystore

      - name: Write key.properties
        run: |
          printf 'storePassword=ExamVault2026!\nkeyPassword=ExamVault2026!\nkeyAlias=examvault\nstoreFile=examvault-release.keystore\n' > android/key.properties
          echo "=== key.properties ==="
          cat android/key.properties

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "No GOOGLE_SERVICES_JSON secret. Using the one already in the repo (if any)."
            if [ -f android/app/google-services.json ]; then
              echo "Found existing google-services.json in repo."
            else
              echo "ERROR: No google-services.json found! Build will fail."
              exit 1
            fi
          else
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written from secret."
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: examvault-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Also build AAB (Play Store bundle)
        run: flutter build appbundle --release
        continue-on-error: true

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: examvault-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
