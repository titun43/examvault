# =============================================================================
# ExamVault - Build Release APK on GitHub Actions (LIFETIME STABLE SIGNING)
# =============================================================================
# This workflow ALWAYS uses the SAME release keystore (stored as a GitHub
# Secret), so every APK ever built here can update the previous one.
# No more "package conflicts with an existing package" errors — ever.
#
# Required GitHub Secrets (see SETUP_SECRETS.md):
#   KEYSTORE_BASE64      base64-encoded examvault-release.keystore
#   KEYSTORE_PASSWORD    keystore store password (ExamVault2026!)
#   KEY_PASSWORD         key password (ExamVault2026!)
#   KEY_ALIAS            key alias (examvault)
#   EXPECTED_SHA1        expected SHA1 fingerprint of the signing cert
#                        (BA:56:A6:05:A0:D8:A3:E1:81:75:C7:33:98:31:74:EF:C4:71:6A:6E)
#
# Optional:
#   GOOGLE_SERVICES_JSON  Firebase config JSON (if not committed in repo)
# =============================================================================

name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK (Stable Key)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Read app version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "App version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download deps
        run: flutter pub get

      # -------------------------------------------------------------------------
      # STEP 1: Decode the REAL keystore from secret — NO temp fallback.
      # If the secret is missing, we FAIL HARD instead of creating a random key.
      # This is what guarantees every build uses the same signing identity.
      #
      # ROBUSTNESS: We strip any whitespace/newlines from the secret value
      # before decoding — common copy-paste artefacts in the GitHub Secrets
      # UI would otherwise cause "base64: invalid input". We also verify the
      # decoded file is non-empty and is a valid keystore (PKCS12 magic bytes).
      # -------------------------------------------------------------------------
      - name: Decode Keystore (MANDATORY)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is MISSING. "
            echo "::error::Without it, the build would create a random keystore and cause "
            echo "::error::'package conflicts' on user devices (cannot update existing installs)."
            echo "::error::See SETUP_SECRETS.md for how to add the secret."
            exit 1
          fi

          # Strip ALL whitespace (spaces, tabs, newlines, carriage returns)
          # that may have been introduced when pasting the base64 string into
          # the GitHub Secrets UI. Base64 itself never contains whitespace.
          CLEAN_B64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n')
          echo "Original secret length: ${#KEYSTORE_BASE64}"
          echo "Cleaned secret length : ${#CLEAN_B64}"

          if [ "${#CLEAN_B64}" -lt 100 ]; then
            echo "::error::KEYSTORE_BASE64 secret is too short (${#CLEAN_B64} chars after cleaning)."
            echo "::error::Expected ~3648 chars. You appear to have pasted a filename, password,"
            echo "::error::or some other short value instead of the actual base64-encoded keystore."
            echo "::error::"
            echo "::error::HOW TO FIX:"
            echo "::error::  1. Open the KEYSTORE_BASE64.txt file in a text editor (it's at the"
            echo "::error::     project root, generated alongside the keystore)."
            echo "::error::  2. Select ALL the content (Ctrl+A) and copy (Ctrl+C)."
            echo "::error::  3. In GitHub: Settings → Secrets and variables → Actions →"
            echo "::error::     KEYSTORE_BASE64 → Update → paste the copied content → Save."
            echo "::error::  4. Re-run this workflow."
            exit 1
          fi

          echo "Decoding keystore from GitHub Secret..."
          printf '%s' "$CLEAN_B64" | base64 --decode > android/app/examvault-release.keystore

          # Verify the decoded file is non-empty and looks like a keystore.
          KSIZE=$(stat -c%s android/app/examvault-release.keystore 2>/dev/null || stat -f%z android/app/examvault-release.keystore)
          echo "Decoded keystore size: $KSIZE bytes"
          if [ "$KSIZE" -lt 1000 ]; then
            echo "::error::Decoded keystore is too small ($KSIZE bytes). The base64 secret may be corrupt."
            exit 1
          fi

          # Quick magic-byte check: PKCS12 keystores start with 0x30 0x82.
          HEX=$(xxd -p -l 2 android/app/examvault-release.keystore 2>/dev/null || true)
          if [ "$HEX" != "3082" ] && [ "$HEX" != "3083" ]; then
            echo "::warning::Decoded file does not start with PKCS12 magic bytes (got: $HEX)."
            echo "::warning::This may still be a valid keystore, but verify the secret value."
          fi
          ls -la android/app/examvault-release.keystore

      # -------------------------------------------------------------------------
      # STEP 2: Verify the keystore's SHA1 fingerprint matches the EXPECTED one.
      # This is the SAFETY NET: if someone ever replaces the keystore secret with
      # a different one, the build fails here — protecting users from getting an
      # APK that can't update their existing install.
      # -------------------------------------------------------------------------
      - name: Verify Keystore Fingerprint (Safety Net)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EXPECTED_SHA1: ${{ secrets.EXPECTED_SHA1 }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$EXPECTED_SHA1" ]; then
            echo "::error::KEYSTORE_PASSWORD / KEY_ALIAS / EXPECTED_SHA1 secrets are required."
            exit 1
          fi
          echo "Verifying keystore SHA1 fingerprint..."
          ACTUAL_SHA1=$(keytool -list -v -keystore android/app/examvault-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" 2>/dev/null \
            | grep -i 'SHA1:' | head -1 | awk '{print $NF}' | tr '[:lower:]' '[:upper:]')
          EXPECTED_SHA1_UP=$(echo "$EXPECTED_SHA1" | tr '[:lower:]' '[:upper:]')

          echo "Expected SHA1: $EXPECTED_SHA1_UP"
          echo "Actual   SHA1: $ACTUAL_SHA1"

          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1_UP" ]; then
            echo "::error::FINGERPRINT MISMATCH!"
            echo "::error::The keystore in GitHub Secrets is NOT the official ExamVault keystore."
            echo "::error::Building with this would produce APKs that CANNOT update existing installs."
            echo "::error::Fix the KEYSTORE_BASE64 secret to use the real examvault-release.keystore."
            exit 1
          fi
          echo "✅ Keystore fingerprint verified — matches the official ExamVault signing key."

      # -------------------------------------------------------------------------
      # STEP 2b: Print the SHA-256 fingerprint too (Jul 4, 2026).
      # Mobile OTP login was failing with "operation-not-allowed" even though
      # Phone sign-in was Enabled in Firebase Console — root cause: only the
      # SHA-1 fingerprint was registered there, but Google's Play Integrity
      # check (used to silently verify Phone Auth requests) requires SHA-256
      # too. This step just prints it in the build log (not a secret value)
      # so the admin can copy it into Firebase Console > Project Settings >
      # Your apps > Android app > "Add fingerprint".
      # -------------------------------------------------------------------------
      - name: Print SHA-256 fingerprint (for Firebase Console)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "Copy the SHA-256 value below into Firebase Console:"
          echo "Project Settings -> Your apps -> com.examvault.education -> Add fingerprint"
          echo ""
          keytool -list -v -keystore android/app/examvault-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" 2>/dev/null \
            | grep -i 'SHA256:'

      # -------------------------------------------------------------------------
      # STEP 3: Write key.properties from secrets (no hardcoded passwords).
      # -------------------------------------------------------------------------
      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=examvault-release.keystore\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          echo "=== key.properties (passwords masked) ==="
          sed 's/=.*/=***/' android/key.properties

      # -------------------------------------------------------------------------
      # STEP 4: google-services.json (Firebase) — from secret OR from repo.
      # -------------------------------------------------------------------------
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "No GOOGLE_SERVICES_JSON secret. Using the one already in the repo (if any)."
            if [ -f android/app/google-services.json ]; then
              echo "Found existing google-services.json in repo."
            else
              echo "::error::No google-services.json found! Build will fail."
              exit 1
            fi
          else
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written from secret."
          fi

      # -------------------------------------------------------------------------
      # STEP 5: Build the signed release APK + AAB.
      # -------------------------------------------------------------------------
      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB (Play Store bundle)
        run: flutter build appbundle --release
        continue-on-error: true

      # -------------------------------------------------------------------------
      # STEP 6: Verify the BUILT APK is actually signed by our key (final check).
      # -------------------------------------------------------------------------
      - name: Verify APK signature
        env:
          EXPECTED_SHA1: ${{ secrets.EXPECTED_SHA1 }}
        run: |
          echo "=== Verifying the built APK signature ==="
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          ls -la "$APK_PATH"

          # Locate apksigner. On ubuntu-latest it lives under the Android SDK
          # build-tools (NOT on $PATH by default). Try several candidates.
          APKSIGNER=""
          for cand in \
            "$ANDROID_HOME/build-tools/*/apksigner" \
            "$ANDROID_SDK_ROOT/build-tools/*/apksigner" \
            /usr/local/lib/android/sdk/build-tools/*/apksigner; do
            hit=$(ls $cand 2>/dev/null | sort -V | tail -1)
            if [ -n "$hit" ] && [ -x "$hit" ]; then
              APKSIGNER="$hit"
              break
            fi
          done
          if [ -z "$APKSIGNER" ]; then
            # Last resort: PATH lookup (may still be missing).
            APKSIGNER=$(command -v apksigner || true)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found anywhere. Cannot verify signature."
            echo "::error::Listing build-tools dir for diagnostics:"
            ls -la /usr/local/lib/android/sdk/build-tools/ 2>/dev/null || true
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"

          # Run verify — capture BOTH stdout and stderr so we can debug.
          CERTS_OUT=$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1 || true)
          echo "=== apksigner output (first 20 lines) ==="
          echo "$CERTS_OUT" | head -20

          # apksigner prints the digest as a bare lowercase hex string
          # (e.g. "ba56a605a0d8a3e18175c733983174efc4716a6e"), while the
          # EXPECTED_SHA1 secret is stored with colons in uppercase
          # (e.g. "BA:56:A6:05:..."). Normalize BOTH by stripping colons
          # (and any other punctuation) and uppercasing before comparing.
          ACTUAL_SHA1=$(echo "$CERTS_OUT" \
            | grep -i 'SHA-1' | head -1 | awk '{print $NF}' \
            | tr -d '[:punct:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED_SHA1_NORM=$(echo "$EXPECTED_SHA1" \
            | tr -d '[:punct:]' | tr '[:lower:]' '[:upper:]')
          echo "APK cert SHA-1 (normalized): $ACTUAL_SHA1"
          echo "Expected SHA-1 (normalized): $EXPECTED_SHA1_NORM"
          if [ -z "$ACTUAL_SHA1" ]; then
            echo "::error::Could not parse SHA-1 from apksigner output (see above)."
            exit 1
          fi
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1_NORM" ]; then
            echo "::error::Built APK is NOT signed by the official key! Aborting."
            exit 1
          fi
          echo "✅ APK is correctly signed by the official ExamVault key."

      # -------------------------------------------------------------------------
      # STEP 6b: Verify the BUILT AAB signature too.
      # Play Console rejects AABs signed with the wrong key. The build.gradle
      # signingConfig applies to both APK and AAB, so they SHOULD match — but
      # we verify explicitly so a wrong-key AAB never reaches the user.
      # Uses keytool -printcert -jarfile (AAB is JAR-format, not APK, so
      # apksigner does not work on it).
      # -------------------------------------------------------------------------
      - name: Verify AAB signature
        env:
          EXPECTED_SHA1: ${{ secrets.EXPECTED_SHA1 }}
        run: |
          echo "=== Verifying the built AAB signature ==="
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::AAB file not found at $AAB_PATH. The Build AAB step may have failed."
            exit 1
          fi
          ls -la "$AAB_PATH"

          echo "=== keytool -printcert -jarfile output ==="
          CERTS_OUT=$(keytool -printcert -jarfile "$AAB_PATH" 2>&1 || true)
          echo "$CERTS_OUT" | head -30

          # keytool prints "SHA1: BA:56:A6:05:..." (with colons, uppercase).
          ACTUAL_SHA1=$(echo "$CERTS_OUT" \
            | grep -i 'SHA1:' | head -1 | awk '{print $NF}' \
            | tr -d '[:punct:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED_SHA1_NORM=$(echo "$EXPECTED_SHA1" \
            | tr -d '[:punct:]' | tr '[:lower:]' '[:upper:]')
          echo "AAB cert SHA-1 (normalized): $ACTUAL_SHA1"
          echo "Expected SHA-1 (normalized): $EXPECTED_SHA1_NORM"
          if [ -z "$ACTUAL_SHA1" ]; then
            echo "::error::Could not parse SHA-1 from keytool output (see above)."
            echo "::error::The AAB may be unsigned or the jarsigner output format changed."
            exit 1
          fi
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1_NORM" ]; then
            echo "::error::Built AAB is NOT signed by the official key!"
            echo "::error::Play Console will reject this AAB with 'signed with the wrong key'."
            echo "::error::This should never happen since build.gradle uses the same signingConfig"
            echo "::error::for APK and AAB — if it does, check the Build AAB step for errors."
            exit 1
          fi
          echo "✅ AAB is correctly signed by the official ExamVault key."
          echo "✅ This AAB can be uploaded to Play Console (upload key matches)."

      # -------------------------------------------------------------------------
      # STEP 7: Generate checksum + rename APK with version for easy tracking.
      # -------------------------------------------------------------------------
      - name: Generate checksums
        id: checksum
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          cp "$APK_PATH" "examvault-${VERSION}.apk"
          sha256sum "examvault-${VERSION}.apk" > "examvault-${VERSION}.apk.sha256"
          echo "=== SHA256 ==="
          cat "examvault-${VERSION}.apk.sha256"
          echo "sha=$(sha256sum "examvault-${VERSION}.apk" | awk '{print $1}')" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------------------
      # STEP 8: Upload artifacts (APK + AAB + checksums).
      # -------------------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: examvault-apk-${{ steps.version.outputs.version }}
          path: |
            examvault-*.apk
            examvault-*.apk.sha256
          retention-days: 90

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: examvault-aab-${{ steps.version.outputs.version }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
          if-no-files-found: ignore

      - name: Build Summary
        run: |
          echo "============================================"
          echo "  ExamVault Build Summary"
          echo "============================================"
          echo "Version : ${{ steps.version.outputs.version }}"
          echo "SHA1    : ${{ secrets.EXPECTED_SHA1 }}"
          echo "SHA256  : ${{ steps.checksum.outputs.sha }}"
          echo "APK     : examvault-${{ steps.version.outputs.version }}.apk"
          echo "Status  : ✅ Signed with official keystore (updates work)"
          echo "============================================"
